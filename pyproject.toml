[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shifting_hulls"
version = "0.1.0"
description = "Simulated port-state-control office for tracking ships that change identity"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "redis>=5,<6",
    "psycopg[binary]>=3.1,<4",
    "pytest>=8,<9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs Docker with real PostgreSQL and Redis; run with make test-integration",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
